services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: PoTraffic
    command: "azurite --tableHost 0.0.0.0 --loose --location /data"
    ports:
      - "10002:10002"   # Table service (the only one the app uses)
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:10002/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - azurite-data:/data

volumes:
  azurite-data:
