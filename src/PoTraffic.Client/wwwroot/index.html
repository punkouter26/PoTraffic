<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>PoTraffic</title>
    <base href="/" />
    <script>
        // Appearance resolver (Rule 4 — system-aware, applied dynamically).
        // Runs in <head>, before first paint, so the page never flashes the wrong
        // theme or the wrong density. Follows the OS preference and re-resolves
        // live when the OS flips; values pinned in localStorage win over the OS.
        // Changes made later, from Settings, are owned by js/pt-appearance.js.
        (function () {
            var root = document.documentElement;
            var pinned = null, density = null;
            try {
                pinned = localStorage.getItem('pt-theme');
                density = localStorage.getItem('pt-density');
            } catch (e) { /* private mode */ }

            var media = window.matchMedia('(prefers-color-scheme: dark)');
            function resolve() {
                root.setAttribute('data-theme', pinned || (media.matches ? 'dark' : 'light'));
            }
            resolve();
            media.addEventListener('change', function () { if (!pinned) resolve(); });

            // Absent attribute means the default density, so only a real choice
            // is stamped.
            if (density) root.setAttribute('data-density', density);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- Bootstrap + Radzen, imported into the `vendor` cascade layer. Everything
         below is unlayered and therefore outranks them whatever the specificity,
         which is what lets the app styles drop their !important escapes. -->
    <link rel="stylesheet" href="css/vendor.css" />

    <link rel="stylesheet" href="css/pt-tokens.css" />
    <link rel="stylesheet" href="css/pt-motion.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="PoTraffic.Client.bundle.scp.css" rel="stylesheet" />

    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PoTraffic" />
    <!-- Service worker + install prompt. Loaded here, not imported from .NET:
         beforeinstallprompt fires long before Blazor WASM has finished booting, and
         it is the only chance to capture it. See js/pt-pwa.js. -->
    <script src="js/pt-pwa.js"></script>

    <!-- View Transitions for SPA navigation. A classic script and not a module,
         because it installs a capture-phase click listener that has to be in place
         before Blazor's own link interception runs. -->
    <script src="js/pt-viewtransition.js"></script>

    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss" aria-hidden="true">×</span>
    </div>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
    <script src="js/blazor-error-reporter.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
