name: CI-CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/azure-sql-edge:latest
        env:
          ACCEPT_EULA: '1'
          MSSQL_SA_PASSWORD: 'CI!P@ssw0rd'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P CI!P@ssw0rd -Q 'SELECT 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 90s

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Cache NuGet packages — dramatically speeds up subsequent runs
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore PoTraffic.slnx

      - name: Build
        run: dotnet build PoTraffic.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/PoTraffic.UnitTests --no-build --configuration Release --logger "trx;LogFileName=unit-results.trx"

      - name: Integration tests
        env:
          ConnectionStrings__Default: "Server=localhost,1433;Database=PoTraffic_CI;User=sa;Password=CI!P@ssw0rd;TrustServerCertificate=true"
        run: dotnet test tests/PoTraffic.IntegrationTests --no-build --configuration Release --logger "trx;LogFileName=integration-results.trx"
        continue-on-error: true

      - name: Install Playwright browsers
        run: pwsh tests/PoTraffic.E2ETests/playwright.ps1 install --with-deps chromium
        continue-on-error: true

      - name: E2E tests
        run: dotnet test tests/PoTraffic.E2ETests --no-build --configuration Release --logger "trx;LogFileName=e2e-results.trx"
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/*.trx"

      - name: Publish API
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: dotnet publish src/PoTraffic.Api/PoTraffic.Api.csproj --configuration Release --output ./publish

      - name: Upload publish artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4.2.1
        with:
          name: api-publish
          path: ./publish

      - name: Azure login (OIDC — no long-lived secrets)
        uses: azure/login@v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create deployment archive
        run: cd publish; zip -r ../publish.zip .

      - name: Deploy to Azure App Service (PoTraffic RG)
        run: |
          # Idempotent settings: disable Oryx build (we deploy pre-built binaries)
          # and keep startup limit generous for cold-start.
          az webapp config appsettings set \
            --resource-group PoTraffic --name potraffic-api \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              WEBSITES_CONTAINER_START_TIME_LIMIT=800 \
            --output none

          # Kudu basic auth is disabled in modern Azure App Service (security default).
          # Use an Azure AD Bearer token — available after az login (OIDC).
          TOKEN=$(az account get-access-token --resource https://management.azure.com \
            --query accessToken -o tsv)

          # POST to Kudu zipdeploy with isAsync=true — returns 202 immediately
          # after the ZIP is received without waiting for app container restart.
          echo "Uploading ZIP to Kudu (async)..."
          HTTP_STATUS=$(curl -s -o /tmp/kudu_resp.txt -w "%{http_code}" \
            --max-time 300 \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @./publish.zip \
            "https://potraffic-api.scm.azurewebsites.net/api/zipdeploy?isAsync=true&clean=true")

          echo "Kudu response: HTTP $HTTP_STATUS"
          cat /tmp/kudu_resp.txt || true

          if [ "$HTTP_STATUS" != "202" ] && [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Kudu zipdeploy failed — HTTP $HTTP_STATUS"
            exit 1
          fi

          # Poll Kudu deployment status until complete (status 4=Success, 3=Failed).
          # Without this, CI health check passes on the OLD running app while the
          # new deployment processes asynchronously and potentially fails.
          echo "Polling Kudu deployment status..."
          for i in $(seq 1 60); do
            DEPLOY_STATUS=$(curl -s \
              -H "Authorization: Bearer $TOKEN" \
              --max-time 15 \
              "https://potraffic-api.scm.azurewebsites.net/api/deployments/latest" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','?'),d.get('complete','?'))" 2>/dev/null || echo "? ?")
            STATUS_CODE=$(echo "$DEPLOY_STATUS" | awk '{print $1}')
            COMPLETE=$(echo "$DEPLOY_STATUS" | awk '{print $2}')
            echo "Kudu deploy status: $STATUS_CODE (complete=$COMPLETE) — attempt $i"
            if [ "$STATUS_CODE" = "4" ] && [ "$COMPLETE" = "True" ]; then
              echo "Deployment succeeded (Kudu status 4)"
              break
            elif [ "$STATUS_CODE" = "3" ] && [ "$COMPLETE" = "True" ]; then
              echo "::error::Kudu deployment failed (status 3)"
              exit 1
            fi
            sleep 10
          done

