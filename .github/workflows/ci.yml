name: CI-CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      sqlserver:
        image: mcr.microsoft.com/azure-sql-edge:latest
        env:
          ACCEPT_EULA: '1'
          MSSQL_SA_PASSWORD: 'CI!P@ssw0rd'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P CI!P@ssw0rd -Q 'SELECT 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 90s

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      # Cache NuGet packages — dramatically speeds up subsequent runs
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore PoTraffic.slnx

      - name: Build
        run: dotnet build PoTraffic.slnx --no-restore --configuration Release

      - name: Verify formatting
        run: dotnet format PoTraffic.slnx --verify-no-changes --verbosity minimal

      - name: Unit tests
        run: dotnet test tests/PoTraffic.UnitTests --no-build --configuration Release --logger "trx;LogFileName=unit-results.trx"

      - name: Integration tests
        env:
          ConnectionStrings__Default: "Server=localhost,1433;Database=PoTraffic_CI;User=sa;Password=CI!P@ssw0rd;TrustServerCertificate=true"
        run: dotnet test tests/PoTraffic.IntegrationTests --no-build --configuration Release --logger "trx;LogFileName=integration-results.trx"
        continue-on-error: true

      - name: Install Playwright browsers
        run: pwsh tests/PoTraffic.E2ETests/playwright.ps1 install --with-deps chromium
        continue-on-error: true

      - name: E2E tests
        run: dotnet test tests/PoTraffic.E2ETests --no-build --configuration Release --logger "trx;LogFileName=e2e-results.trx"
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/*.trx"

      - name: Publish API
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: dotnet publish src/PoTraffic.Api/PoTraffic.Api.csproj --configuration Release --output ./publish

      - name: Upload publish artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4.2.1
        with:
          name: api-publish
          path: ./publish

      - name: Azure login (OIDC — no long-lived secrets)
        uses: azure/login@v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Create deployment archive
        run: cd publish; zip -r ../publish.zip .

      - name: Deploy to Azure App Service (PoTraffic RG)
        run: |
          # Idempotent settings: disable Oryx build (we deploy pre-built binaries)
          # and keep startup limit generous for cold-start.
          az webapp config appsettings set \
            --resource-group PoTraffic --name potraffic-api \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              WEBSITES_CONTAINER_START_TIME_LIMIT=800 \
            --output none

          # Explicitly set startup command — the publish output contains two runtimeconfig.json
          # files (PoTraffic.Api and PoTraffic.Client) which confuses Azure auto-detection.
          # Without this, Azure may run the wrong DLL and serve the Welcome page.
          az webapp config set \
            --resource-group PoTraffic --name potraffic-api \
            --startup-file "dotnet PoTraffic.Api.dll" \
            --output none

          # az webapp deploy uses OIDC-derived credentials automatically (no manual
          # token plumbing needed) and is the recommended CLI command for zip deployments.
          # --clean ensures stale files from previous deploys are removed.
          # --async avoids the 10-min curl timeout while still polling for completion.
          echo "Deploying ZIP to potraffic-api..."
          az webapp deploy \
            --resource-group PoTraffic \
            --name potraffic-api \
            --src-path ./publish.zip \
            --type zip \
            --clean true \
            --async true

          # Poll until the deployment is complete (status 4=Success, 3=Failed).
          echo "Polling deployment status..."
          for i in $(seq 1 60); do
            DEPLOY_STATUS=$(az webapp deployment list \
              --resource-group PoTraffic --name potraffic-api \
              --query "[0].{status:status,complete:complete}" \
              --output json 2>/dev/null || echo '{"status":null,"complete":false}')
            STATUS_CODE=$(echo "$DEPLOY_STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','?'))" 2>/dev/null || echo "?")
            COMPLETE=$(echo "$DEPLOY_STATUS"   | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('complete','?'))" 2>/dev/null || echo "?")
            echo "Deploy status: $STATUS_CODE (complete=$COMPLETE) — attempt $i"
            if [ "$STATUS_CODE" = "4" ] && [ "$COMPLETE" = "True" ]; then
              echo "Deployment succeeded (status 4)"
              break
            elif [ "$STATUS_CODE" = "3" ] && [ "$COMPLETE" = "True" ]; then
              echo "::error::Deployment failed (status 3)"
              exit 1
            fi
            sleep 10
          done

      - name: Verify deployment health
        run: |
          curl --fail --show-error --silent \
            --retry 10 \
            --retry-delay 10 \
            --retry-connrefused \
            "https://potraffic-api.azurewebsites.net/health"
