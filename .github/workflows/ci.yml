name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/azure-sql-edge:latest
        env:
          ACCEPT_EULA: '1'
          MSSQL_SA_PASSWORD: 'CI!P@ssw0rd'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P CI!P@ssw0rd -Q 'SELECT 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 90s

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Cache NuGet packages — dramatically speeds up subsequent runs
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore PoTraffic.slnx

      - name: Build
        run: dotnet build PoTraffic.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/PoTraffic.UnitTests --no-build --configuration Release --logger "trx;LogFileName=unit-results.trx"

      - name: Integration tests
        env:
          ConnectionStrings__Default: "Server=localhost,1433;Database=PoTraffic_CI;User=sa;Password=CI!P@ssw0rd;TrustServerCertificate=true"
        run: dotnet test tests/PoTraffic.IntegrationTests --no-build --configuration Release --logger "trx;LogFileName=integration-results.trx"
        continue-on-error: true

      - name: Install Playwright browsers
        run: pwsh tests/PoTraffic.E2ETests/playwright.ps1 install --with-deps chromium
        continue-on-error: true

      - name: E2E tests
        run: dotnet test tests/PoTraffic.E2ETests --no-build --configuration Release --logger "trx;LogFileName=e2e-results.trx"
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/*.trx"

      - name: Publish API
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet publish src/PoTraffic.Api/PoTraffic.Api.csproj --configuration Release --output ./publish

      - name: Upload publish artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4.2.1
        with:
          name: api-publish
          path: ./publish

      - name: Azure login (OIDC — no long-lived secrets)
        uses: azure/login@v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create deployment archive
        run: cd publish; zip -r ../publish.zip .

      - name: Deploy to Azure App Service (PoTraffic RG)
        run: |
          # Get Kudu publishing credentials (always available via OIDC service principal)
          KUDU_USER=$(az webapp deployment list-publishing-credentials \
            --resource-group PoTraffic --name potraffic-api \
            --query publishingUserName -o tsv)
          KUDU_PASS=$(az webapp deployment list-publishing-credentials \
            --resource-group PoTraffic --name potraffic-api \
            --query publishingPassword -o tsv)

          # Use Kudu REST API with isAsync=true — returns 202 immediately after the
          # ZIP is received, without waiting for the app container to start.
          # 'az webapp deploy' fails on free-tier idle containers (SCM warmup 503).
          # 'az webapp deployment source config-zip' hangs until app starts (sync).
          # This direct Kudu call is the only reliably async option.
          echo "Uploading ZIP to Kudu (async)..."
          HTTP_STATUS=$(curl -s -o /tmp/kudu_resp.txt -w "%{http_code}" \
            --max-time 300 \
            -X POST \
            -u "$KUDU_USER:$KUDU_PASS" \
            -H "Content-Type: application/zip" \
            --data-binary @./publish.zip \
            "https://potraffic-api.scm.azurewebsites.net/api/zipdeploy?isAsync=true&clean=true")

          echo "Kudu response: HTTP $HTTP_STATUS"
          cat /tmp/kudu_resp.txt || true

          if [ "$HTTP_STATUS" != "202" ] && [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Kudu zipdeploy failed — HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Deployment queued (HTTP $HTTP_STATUS). Waiting for app to start..."

      # App needs ~2-3 min to cold-start (Key Vault + DB migrations on Linux container).
      # Retry up to 20 times with 15s intervals (max 5 min total) before failing.
      - name: Health check
        run: |
          echo "Waiting 60s for app cold-start..."
          sleep 60
          for i in $(seq 1 20); do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://potraffic-api.azurewebsites.net/health || echo "000")
            echo "Attempt $i — Health endpoint returned: $status"
            if [ "$status" = "200" ]; then
              echo "::notice::Deployment healthy — HTTP $status"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Health check failed after all retries"
          exit 1
