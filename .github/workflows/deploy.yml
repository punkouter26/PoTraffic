name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for azure/login OIDC (federated, no stored client secret)

env:
  DOTNET_VERSION: '10.0.x'
  AZURE_WEBAPP_NAME: potraffic-api-win
  AZURE_RESOURCE_GROUP: PoTraffic
  API_PROJECT_PATH: src/PoTraffic.API/PoTraffic.API.csproj
  UNIT_TEST_PATH: tests/PoTraffic.UnitTests/PoTraffic.UnitTests.csproj
  PRODUCTION_URL: https://potraffic-api-win.azurewebsites.net
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lightweight YAML: the UNIT tier only. It is 99 tests in under a second and needs
  # nothing but the SDK, so it costs the pipeline almost nothing and stops a broken build
  # from ever becoming an artifact. The integration and E2E tiers stay out deliberately —
  # they need Docker for Azurite and a live Testing host for Playwright, which would take
  # this job from about a minute to many. Those run locally via
  # `pwsh ./SCRIPTS/run-tests.ps1`, which produces the full four-tier HTML report.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore ${{ env.API_PROJECT_PATH }}
      - run: dotnet build ${{ env.API_PROJECT_PATH }} --no-restore -c Release
      - name: Unit tests
        run: dotnet test ${{ env.UNIT_TEST_PATH }} -c Release --logger "console;verbosity=minimal"
      - run: dotnet publish ${{ env.API_PROJECT_PATH }} -c Release --no-build -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: publish
          retention-days: 1

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    # Deploy only from master on push or manual dispatch.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    timeout-minutes: 15
    environment:
      name: production
      url: https://potraffic-api-win.azurewebsites.net
    steps:
      # Only SCRIPTS/ — the deploy job needs the smoke script and nothing else, and a full
      # checkout here would pull the whole repo to run one file.
      - uses: actions/checkout@v6
        with:
          sparse-checkout: SCRIPTS
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: webapp
          path: publish
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ env.AZURE_RESOURCE_GROUP }}
          package: publish

      # The deploy step reports success once App Service accepts the package, which says
      # nothing about whether the app then starts. This is the check that it did: health,
      # hydration, and the Blazor shell and boot assets actually serving. It exits non-zero
      # on any Fail, so a green deploy that boots into 500.30 turns the run red.
      - name: Post-deploy smoke
        shell: pwsh
        run: ./SCRIPTS/post-deploy-smoke.ps1 -BaseUrl "${{ env.PRODUCTION_URL }}"
