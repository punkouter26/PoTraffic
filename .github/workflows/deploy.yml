name: CI/CD — Build, Test & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for azure/login OIDC (federated, no stored client secret)

env:
  DOTNET_VERSION: '10.0.x'
  AZURE_WEBAPP_NAME: potraffic-api
  AZURE_RESOURCE_GROUP: PoTraffic
  SOLUTION_PATH: PoTraffic.slnx
  API_PROJECT_PATH: src/PoTraffic.Api/PoTraffic.Api.csproj
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore ${{ env.SOLUTION_PATH }}
      - run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore -c Release
      # Reuse the Release build output (--no-build) so publish does not recompile.
      - run: dotnet publish ${{ env.API_PROJECT_PATH }} -c Release --no-build -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: publish
          retention-days: 1

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build-and-test
    # Deploy from master on push or manual dispatch; never on PRs.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    timeout-minutes: 15
    environment:
      name: production
      url: https://potraffic-api.azurewebsites.net
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webapp
          path: publish
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # webapps-deploy v3 zips the folder itself — no manual zip step needed.
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ env.AZURE_RESOURCE_GROUP }}
          package: publish
      - name: Smoke test (/health)
        run: |
          for i in $(seq 1 8); do
            sleep 15
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health" || echo 000)
            echo "Attempt $i: HTTP $code"
            [ "$code" = "200" ] && { echo "Deployment verified healthy."; exit 0; }
          done
          echo "::warning::/health did not return 200 after retries — check App Service logs."
